[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-match-sim"
version = "0.1.0"
description = "Offline research utilities toward an FM27 match simulation harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fm-match-sim = "fm_match_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
